name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Validate Repository Configuration
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      config_package: ${{ steps.config_package.outputs.configPackage }}
    steps:
      # Ensure that required repository variable has been created for the Package
      - name: Validate Package Config
        id: config_package
        run: |
          if [ "${VARS_PACKAGE_NAME}" != "" ]; then
            echo "configPackage=true" >> "$GITHUB_OUTPUT";
          else
            echo "configPackage=false" >> "$GITHUB_OUTPUT";
          fi
        env:
          VARS_PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}

  # Build and release the Package
  # If the repository is not configured properly, this job will be skipped
  build:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: needs.config.outputs.config_package == 'true'
    steps:
      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Get the Package version based on the package.json file
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@1.0.7
        with:
          file_path: "package.json"
          prop_path: "version"

      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          {
            echo "zipFile=${VARS_PACKAGE_NAME}-${STEPS_VERSION_OUTPUTS_VALUE}.zip";
            echo "unityPackage=${VARS_PACKAGE_NAME}-${STEPS_VERSION_OUTPUTS_VALUE}.unitypackage";
            echo "version=${STEPS_VERSION_OUTPUTS_VALUE}";
          }  >> "$GITHUB_ENV"
        env:
          VARS_PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
          STEPS_VERSION_OUTPUTS_VALUE: ${{ steps.version.outputs.value }}

      - name: Removes Directories before Archiving
        run: |
          rm -rf Assets* Packages* ProjectSettings* Tests*

      # Zip the Package for release
      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: "zip"
          filename: "${{ env.zipFile }}"
          exclusions: "*.git* .editorconfig"

      - name: Prints SHA256 checksum
        run: sha256sum "${zipFile}"

      # Build a list of .meta files for future use
      - name: Track Package Meta Files
        run: find "./" -name \*.meta >> metaList

      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList

      # Make a release tag of the version from the package.json file
      - name: Create Tag
        id: tag_version
        uses: rickstaa/action-create-tag@v1.7.2
        with:
          tag: "${{ env.version }}"

      - name: Make Release
        run: gh release create "${version}" "${zipFile}" "${unityPackage}" package.json
        env:
          GH_TOKEN: ${{ github.token }}
